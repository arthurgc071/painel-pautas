name: Atualizar painel

on:
  schedule:
    # A cada 4 horas (horário UTC). No Brasil: ~01h20, 05h20, 09h20, 13h20, 17h20, 21h20
    - cron: "23 */4 * * *"
  workflow_dispatch: {}   # botão "Run workflow" para rodar na hora

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: painel
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Coletar notícias e montar pautas
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
        run: python scripts/collect.py

      - name: Salvar os dados no repositório
        run: |
          git config user.name "painel-bot"
          git config user.email "painel-bot@users.noreply.github.com"
          git add docs/data/news.json
          git diff --cached --quiet || git commit -m "Atualiza pautas $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
