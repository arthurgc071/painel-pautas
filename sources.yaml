# Fontes do painel. Para adicionar uma fonte, copie uma linha e troque os dados.
#
# Dois tipos de fonte:
#   rss:    o endereço do feed RSS do site
#   google: uma busca no Google News (funciona para qualquer site, mesmo sem RSS)
#           use "site:dominio.com.br" para puxar só de um veículo

janela_horas: 50          # notícias mais antigas que isso são descartadas
max_historias_por_frente: 15   # quantas histórias aparecem em cada frente

ECONOMIA:
  - nome: Valor Econômico
    google: "site:valor.globo.com"
  - nome: InfoMoney
    rss: https://www.infomoney.com.br/feed/
  - nome: Exame Economia
    google: "site:exame.com economia"
  - nome: Folha Mercado
    google: "site:folha.uol.com.br/mercado"
  - nome: Estadão Economia
    google: "site:estadao.com.br/economia"
  - nome: Bloomberg Línea
    google: "site:bloomberglinea.com.br"
  - nome: Brazil Journal
    google: "site:braziljournal.com"
  - nome: Google News - Economia BR
    google: "Selic OR inflação OR IPCA OR Copom OR PIB OR câmbio OR Ibovespa"

STARTUPS:
  # Foco: cases de empresas (rodadas, unicórnios, aquisições, expansão, viradas)
  - nome: NeoFeed
    google: "site:neofeed.com.br startup OR rodada OR aporte OR fundador"
  - nome: Startups.com.br
    rss: https://startups.com.br/feed/
  - nome: Pipeline (Valor)
    google: "site:pipelinevalor.globo.com"
  - nome: Brazil Journal - startups
    google: "site:braziljournal.com startup OR rodada OR unicórnio OR fundador"
  - nome: Exame - startups
    google: "site:exame.com startup rodada OR aporte OR unicórnio OR fundador"
  - nome: Google News - Rodadas
    google: "startup (\"série A\" OR \"série B\" OR \"série C\" OR \"série D\" OR aporte OR capta OR levanta)"
  - nome: Google News - Unicórnios e aquisições
    google: "startup (unicórnio OR aquisição OR adquire OR IPO OR valuation)"
  - nome: Google News - Expansão e viradas
    google: "startup brasileira (expansão OR internacional OR lucro OR demissões OR receita)"
  - nome: TechCrunch - América Latina
    google: "site:techcrunch.com Brazil OR \"Latin America\" startup"
